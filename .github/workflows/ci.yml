name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://hms:hms@localhost:5432/hms_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      PORT: '3000'
      HOSTNAME: 127.0.0.1
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Verify admin bootstrap
        env:
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_NAME: CI Administrator
          ADMIN_PASSWORD: ci-only-admin-password
        run: npm run db:create-admin

      - name: Build
        run: npm run build

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-only-db-password
        run: docker compose config --quiet

      - name: Smoke test
        run: |
          npm start > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health" > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS "$APP_URL/api/health" > /dev/null; then
            cat /tmp/app.log
            exit 1
          fi

          npm run smoke

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target runner -t hms:ci .
